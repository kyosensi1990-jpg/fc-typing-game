<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FC身内ネタ 限界タイピング</title>
<style>
:root{--bg:#0b1020;--panel:#151d35;--card:#1d2847;--text:#f6f7fb;--muted:#9eabc9;--accent:#7c9cff;--good:#62d69b;--bad:#ff6b7a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b2850 0,#0b1020 48%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
.wrap{width:min(980px,calc(100% - 28px));margin:40px auto}.title{text-align:center;margin-bottom:22px}.title small{color:var(--muted);font-weight:800;letter-spacing:.15em}.title h1{margin:8px 0;font-size:clamp(28px,5vw,48px)}.title p{color:var(--muted)}
.game{display:grid;grid-template-columns:1fr 220px;gap:16px}.main,.stat{background:rgba(21,29,53,.94);border:1px solid #2b3962;border-radius:20px;box-shadow:0 18px 55px #0005}.main{padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.timer{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums}
.question{margin-top:22px;padding:30px 20px;text-align:center;background:var(--card);border:1px solid #34446f;border-radius:16px}.label{font-size:12px;color:var(--muted);font-weight:800}.jp{font-size:clamp(24px,4vw,38px);font-weight:900;margin:12px 0}.roman{font:700 20px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);word-break:break-all}.progress{min-height:32px;margin-top:12px;font:700 20px ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}
input{width:100%;margin-top:18px;padding:16px;border-radius:14px;border:1px solid #40517f;background:#0d1428;color:white;font-size:20px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c9cff33}input:disabled{opacity:.55}
.msg{min-height:24px;margin:10px 2px;color:var(--muted)}.buttons{display:flex;gap:10px}.buttons button{border:0;border-radius:13px;padding:13px 20px;font-weight:900;font-size:16px;cursor:pointer}.start{background:var(--accent);color:#081127}.reset{background:#2b3658;color:white}.stats{display:grid;gap:12px}.stat{padding:18px}.stat span{display:block;color:var(--muted);font-size:12px;font-weight:800}.stat strong{display:block;margin-top:4px;font-size:30px}.help{margin-top:16px;color:var(--muted);font-size:13px;line-height:1.7}
@media(max-width:720px){.wrap{margin:18px auto}.game{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.main{padding:16px}.question{padding:24px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">
    <small>HAW TYPING CHALLENGE</small>
    <h1>FC身内ネタ 限界タイピング</h1>
    <p>60秒でFC語録をどこまで打てる？</p>
  </div>
  <div class="game">
    <main class="main">
      <div class="top"><b>TYPE FAST!</b><div id="time" class="timer">60.0</div></div>
      <div class="question">
        <div class="label">お題</div>
        <div id="jp" class="jp">俺はカフカ</div>
        <div id="roman" class="roman">orehakafuka</div>
        <div id="progress" class="progress"></div>
      </div>
      <input id="input" disabled autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="スタートを押して入力！">
      <div id="msg" class="msg">スタートを押すと60秒カウント開始。</div>
      <div class="buttons"><button id="start" class="start">スタート</button><button id="reset" class="reset">リセット</button></div>
      <div class="help">※「し」は shi / si、「ち」は chi / ti、「ちょ」は cho / tyo など複数のローマ字入力に対応。</div>
    </main>
    <aside class="stats">
      <div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
      <div class="stat"><span>COMBO</span><strong id="combo">0</strong></div>
      <div class="stat"><span>正確率</span><strong id="accuracy">100%</strong></div>
      <div class="stat"><span>クリア</span><strong id="clears">0</strong></div>
    </aside>
  </div>
</div>
<script>
const words=[
 ["俺はカフカ","おれはかふか"],
 ["もぎもぎ～","もぎもぎ"],
 ["ここには何もない","ここにはなにもない"],
 ["さかなクン","さかなくん"],
 ["ぱむぱむ～","ぱむぱむ"],
 ["時代はインセインエアー","じだいはいんせいんえあー"],
 ["ちょっと食べるラー油","ちょっとたべるらーゆ"],
 ["ファンフェスまでに痩せないと","ふぁんふぇすまでにやせないと"],
 ["エイペックスやりましょうよー","えいぺっくすやりましょうよー"],
 ["アルミホイルエゾリス","あるみほいるえぞりす"],
 ["アダムナガイ","あだむながい"],
 ["俺クラス８人","おれくらすはちにん"],
 ["俺はどう見てもSでしょ","おれはどうみてもえすでしょ"],
 ["またくのハイアルテマリジャ","またくのはいあるてまりじゃ"],
 ["ねっとりMです","ねっとりえむです"],
 ["ドコモのお姉さん","どこものおねえさん"],
 ["寝ます！！！","ねます"],
 ["チー牛童貞","ちーぎゅうどうてい"],
 ["むきむきエゾリス","むきむきえぞりす"]
];

const roma = {
 "あ":["a"],"い":["i","yi"],"う":["u","wu"],"え":["e"],"お":["o"],
 "か":["ka","ca"],"き":["ki"],"く":["ku","cu","qu"],"け":["ke"],"こ":["ko","co"],
 "さ":["sa"],"し":["shi","si","ci"],"す":["su"],"せ":["se","ce"],"そ":["so"],
 "た":["ta"],"ち":["chi","ti"],"つ":["tsu","tu"],"て":["te"],"と":["to"],
 "な":["na"],"に":["ni"],"ぬ":["nu"],"ね":["ne"],"の":["no"],
 "は":["ha"],"ひ":["hi"],"ふ":["fu","hu"],"へ":["he"],"ほ":["ho"],
 "ま":["ma"],"み":["mi"],"む":["mu"],"め":["me"],"も":["mo"],
 "や":["ya"],"ゆ":["yu"],"よ":["yo"],
 "ら":["ra"],"り":["ri"],"る":["ru"],"れ":["re"],"ろ":["ro"],
 "わ":["wa"],"を":["wo"],"ん":["n","nn","xn"],
 "が":["ga"],"ぎ":["gi"],"ぐ":["gu"],"げ":["ge"],"ご":["go"],
 "ざ":["za"],"じ":["ji","zi"],"ず":["zu"],"ぜ":["ze"],"ぞ":["zo"],
 "だ":["da"],"ぢ":["ji","di"],"づ":["zu","du"],"で":["de"],"ど":["do"],
 "ば":["ba"],"び":["bi"],"ぶ":["bu"],"べ":["be"],"ぼ":["bo"],
 "ぱ":["pa"],"ぴ":["pi"],"ぷ":["pu"],"ぺ":["pe"],"ぽ":["po"],
 "きゃ":["kya"],"きゅ":["kyu"],"きょ":["kyo"],
 "しゃ":["sha","sya"],"しゅ":["shu","syu"],"しょ":["sho","syo"],
 "ちゃ":["cha","tya"],"ちゅ":["chu","tyu"],"ちょ":["cho","tyo"],
 "にゃ":["nya"],"にゅ":["nyu"],"にょ":["nyo"],
 "ひゃ":["hya"],"ひゅ":["hyu"],"ひょ":["hyo"],
 "みゃ":["mya"],"みゅ":["myu"],"みょ":["myo"],
 "りゃ":["rya"],"りゅ":["ryu"],"りょ":["ryo"],
 "ぎゃ":["gya"],"ぎゅ":["gyu"],"ぎょ":["gyo"],
 "じゃ":["ja","jya","zya"],"じゅ":["ju","jyu","zyu"],"じょ":["jo","jyo","zyo"],
 "びゃ":["bya"],"びゅ":["byu"],"びょ":["byo"],
 "ぴゃ":["pya"],"ぴゅ":["pyu"],"ぴょ":["pyo"],
 "ふぁ":["fa","fwa"],"ふぃ":["fi","fwi"],"ふぇ":["fe","fwe"],"ふぉ":["fo","fwo"],
 "てぃ":["thi","texi","teli"],"でぃ":["dhi","dexi","deli"],
 "うぃ":["wi"],"うぇ":["we"],"うぉ":["who"],
 "ー":["-"]
};

function tokenize(kana){
 const out=[];
 for(let i=0;i<kana.length;){
   const pair=kana.slice(i,i+2);
   if(roma[pair]){out.push(pair);i+=2;continue;}
   out.push(kana[i]);i++;
 }
 return out;
}

function tokenOptions(tokens, i){
 const k=tokens[i];
 if(k==="っ" && i+1<tokens.length){
   const next=roma[tokens[i+1]]||[""];
   const heads=[...new Set(next.map(x=>x[0]).filter(x=>/[a-z]/.test(x)))];
   return heads.length?heads:["xtu","ltu"];
 }
 return roma[k]||[k];
}

function allRomanizations(kana, cap=4000){
 const tokens=tokenize(kana);
 let list=[""];
 for(let i=0;i<tokens.length;i++){
   const opts=tokenOptions(tokens,i);
   let next=[];
   for(const base of list) for(const o of opts){
     next.push(base+o);
     if(next.length>=cap) break;
   }
   list=next;
 }
 return [...new Set(list)];
}

const $=id=>document.getElementById(id);
const input=$("input"),jp=$("jp"),roman=$("roman"),progress=$("progress");
let active=false,timer=null,endAt=0,current=0,last=-1,score=0,combo=0,clears=0,keys=0,misses=0,candidates=[];

function choose(){
 let n=Math.floor(Math.random()*words.length);
 if(words.length>1&&n===last)n=(n+1)%words.length;
 last=n;current=n;jp.textContent=words[n][0];
 candidates=allRomanizations(words[n][1]);
 roman.textContent=candidates[0];
 input.value="";paint("");
}
function matching(v){return candidates.filter(x=>x.startsWith(v));}
function paint(v){
 const matches=matching(v);
 const t=(matches[0]||candidates[0]||"");
 progress.innerHTML="";
 const a=document.createElement("span");a.textContent=v;a.style.color="var(--good)";
 const b=document.createElement("span");b.textContent=t.slice(v.length);b.style.color="var(--muted)";
 progress.append(a,b);
 roman.textContent=t;
}
function stats(){
 $("score").textContent=score;$("combo").textContent=combo;$("clears").textContent=clears;
 $("accuracy").textContent=(keys?Math.round(Math.max(0,keys-misses)/keys*100):100)+"%";
}
function finish(){
 if(!active)return;active=false;clearInterval(timer);timer=null;input.disabled=true;$("time").textContent="0.0";
 const acc=keys?Math.round(Math.max(0,keys-misses)/keys*100):100;
 $("msg").textContent=`終了！ ${clears}問クリア / ${score}点 / 正確率 ${acc}%`;
 $("start").textContent="もう一回";
}
function tick(){
 const left=Math.max(0,endAt-performance.now());$("time").textContent=(left/1000).toFixed(1);
 if(left<=0)finish();
}
function start(){
 if(timer)clearInterval(timer);active=true;score=combo=clears=keys=misses=0;stats();choose();
 endAt=performance.now()+60000;$("time").textContent="60.0";input.disabled=false;input.focus();$("msg").textContent="GO！";
 $("start").textContent="プレイ中";timer=setInterval(tick,50);
}
function reset(){
 active=false;if(timer)clearInterval(timer);timer=null;score=combo=clears=keys=misses=0;
 $("time").textContent="60.0";input.disabled=true;input.value="";stats();choose();$("msg").textContent="スタートを押すと60秒カウント開始。";$("start").textContent="スタート";
}
input.addEventListener("input",()=>{
 if(!active)return;
 let v=input.value.toLowerCase();keys++;
 const matches=matching(v);
 if(v && matches.length===0){
   misses++;combo=0;input.value=v.slice(0,-1);$("msg").textContent="MISS！";paint(input.value);stats();return;
 }
 paint(v);
 if(candidates.includes(v)){
   clears++;combo++;score+=v.length*10+Math.min(combo,10)*10;
   $("msg").textContent=combo>=3?`${combo} COMBO！`:"NICE！";stats();choose();
 }
});
$("start").addEventListener("click",start);$("reset").addEventListener("click",reset);choose();stats();
</script>
</body>
</html>
